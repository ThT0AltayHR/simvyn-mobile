kind = "mobile"
previewPath = "/"
title = "Simvyn Mobile"
version = "1.0.0"
id = "artifacts/simvyn-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22565

[services.development]
run = "pnpm --filter @workspace/simvyn-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/simvyn-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/simvyn-mobile", "run", "serve" ]

[services.env]
PORT = "22565"
BASE_PATH = "/"
