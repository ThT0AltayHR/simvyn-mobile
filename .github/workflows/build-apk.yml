name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare standalone package.json
        run: cp npm-package.json package.json

      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Pandroid.enableJetifier=true

      - name: Collect APK
        run: |
          mkdir -p release
          find android/app/build/outputs/apk -name "*.apk" | head -1 | xargs -I{} cp {} release/simvyn-mobile-v${{ github.run_number }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simvyn-mobile-apk
          path: release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Simvyn Mobile v${{ github.run_number }}"
          body: |
            ## Simvyn Mobile APK

            Universal mobile devtool — control iOS Simulators, Android Emulators, and real devices from a single dashboard.

            ### Features
            - Device Management (boot, shutdown, erase, clone)
            - App Management (install, launch, terminate, uninstall)
            - Real-time Log Viewer with regex filtering
            - GPS Location Simulation
            - Screenshot & Screen Recording
            - Deep Links
            - Push Notifications
            - File Browser
            - SQLite Database Inspector
            - Device Settings (dark mode, locale, orientation)
            - Crash Logs
            - Media Push
            - Clipboard
            - Collections (action sequences)

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" on your Android device
            3. Install the APK
            4. Open app and enter your Simvyn server URL (e.g. `http://192.168.1.x:3001`)

            ---
            **Developer:** AltayHR Developer  
            **Website:** [turkhackteam.org](https://turkhackteam.org)

            > Requires a running [Simvyn](https://github.com/pranshuchittora/simvyn) server on your local network.
          files: release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
